<meta charset="utf-8">
<title>vst5</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="vst5: plugins de audio basados en máquinas clásicas, con el workflow de hoy. Hechos en Argentina.">
<link rel="icon" href="logo/vst5-favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: vitrina (elección 1B·2B·3B·4B·5A). Página clara con bandas oscuras: franja de oferta, fila de promos,
   carrusel de un plugin a la vez, grilla de tienda, ficha de compra por plugin (#clip5…) y carrito lateral.
   Tokens = BRAND.md. El color de cada plugin solo marca lo activo; el LED solo en piezas de vst5. */
:root{
  --tinta:#171614; --chasis:#3A3834; --gris:#6E6A62; --alu:#D8D5CE; --hueso:#F1EFEA; --led:#FF5B14;
  --clip5:#F2C230; --sampler5:#D93A2B; --drum5:#6FA83A;
  --bg:#F1EFEA; --fg:#171614; --muted:#6E6A62; --line:#D8D5CE; --card:#FAF9F6; --shade:#E6E3DC;
  --band:#171614; --band-fg:#F1EFEA; --band-muted:#B5B1A9;
  --ok:#2F7A3A;
  --d:"Archivo",ui-sans-serif,system-ui,sans-serif; --m:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --out:cubic-bezier(.16,1,.3,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#121110;--fg:#F1EFEA;--muted:#B5B1A9;--line:#33302C;--card:#1B1A18;--shade:#22211F;--band:#22211F;--ok:#5FBF6E;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121110;--fg:#F1EFEA;--muted:#B5B1A9;--line:#33302C;--card:#1B1A18;--shade:#22211F;--band:#22211F;--ok:#5FBF6E;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:80px}
body{background:var(--bg);color:var(--fg);font:400 16px/1.55 var(--d);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-weight:800;line-height:1.04;text-wrap:balance}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--fg);outline-offset:3px;border-radius:4px}
.wrap{max-width:1240px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font:500 12px var(--m);letter-spacing:.08em;text-transform:uppercase}
.muted{color:var(--muted)}
.num{font-family:var(--m);font-weight:500;font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Franja de oferta + menú */
.strip{display:block;background:var(--led);color:var(--tinta);text-align:center;padding:9px 16px;font-weight:600;font-size:14px;text-decoration:none}
.strip:hover{text-decoration:underline;text-underline-offset:3px}
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--bg);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;gap:32px;height:68px}
.logo{display:block;color:var(--fg)}
.logo svg{display:block;height:30px;width:auto}
.nav ul{display:flex;gap:26px;list-style:none;margin:0;padding:0}
.nav ul a{text-decoration:none;font-weight:500}
.nav ul a:hover,.nav ul a[aria-current]{text-decoration:underline;text-underline-offset:6px;text-decoration-thickness:2px}
.cart-btn{margin-left:auto;display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 8px 7px 16px;font-weight:600;font-size:14px;cursor:pointer}
.cart-btn b{min-width:24px;height:24px;border-radius:12px;background:var(--fg);color:var(--bg);display:grid;place-items:center;font:500 12px var(--m);padding-inline:6px}
@media (max-width:760px){.nav ul{display:none}}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:13px 22px;font-weight:600;font-size:15px;cursor:pointer;text-decoration:none;white-space:nowrap;transition:transform .15s,background-color .2s,color .2s}
.btn:active{transform:translateY(1px)}
.btn-main{background:var(--fg);color:var(--bg)}
.btn-line{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.btn-line:hover{background:var(--card)}
.btn-light{background:var(--band-fg);color:var(--tinta)}
.btn-ghost{background:transparent;color:var(--band-fg);box-shadow:inset 0 0 0 1px #57544E}
.btn.in{background:var(--ok);color:#fff}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn-wide{width:100%}

/* Promos */
.chips{display:flex;gap:12px;overflow-x:auto;padding-block:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:14px;min-width:270px;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:10px 18px 10px 10px;text-decoration:none}
.chip:hover{border-color:var(--fg)}
.chip i{flex:none;display:grid;place-items:center;width:56px;height:56px;border-radius:50%;background:var(--c,var(--fg));color:var(--tinta);font:500 10px/1.1 var(--m);letter-spacing:.06em;font-style:normal;text-align:center}
.chip i.inv{background:var(--fg);color:var(--bg)}
.chip span{display:grid;line-height:1.3}
.chip b{font-weight:700}

/* Carrusel */
.hero{position:relative;background:var(--band);color:var(--band-fg);border-radius:14px;overflow:hidden}
.slides{display:grid}
.slide{grid-area:1/1;display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);align-items:center;gap:32px;padding:56px 0 76px 56px;opacity:0;visibility:hidden;transition:opacity .5s var(--out),visibility .5s}
.slide.on{opacity:1;visibility:visible}
.slide .tx{display:flex;flex-direction:column;align-items:flex-start;gap:16px;min-width:0}
.slide .tx .mono{color:var(--band-muted)}
.slide h2{font-size:clamp(44px,6.4vw,88px);font-stretch:118%;letter-spacing:-.015em}
.slide p{font-size:19px;color:var(--band-muted);max-width:22em}
.slide .row{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.slide .art{min-width:0;transform:translateX(24px);transition:transform .7s var(--out)}
.slide.on .art{transform:none}
#app img{display:block;width:100%;height:auto;border-radius:6px}
.slide .art img{width:116%;border-radius:10px;box-shadow:0 24px 50px rgba(0,0,0,.5)}
.slide .trio{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding-right:56px}
.slide .trio img{width:100%}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:start}
.hero-ctl{position:absolute;left:56px;bottom:26px;display:flex;align-items:center;gap:10px}
.hero-ctl .dot{width:34px;height:20px;border:0;padding:0;background:none;cursor:pointer;display:grid;align-items:center}
.hero-ctl .dot::before{content:"";height:3px;border-radius:2px;background:#57544E}
.hero-ctl .dot[aria-current="true"]::before{background:var(--band-fg)}
.hero-ctl .arr{width:32px;height:32px;border-radius:50%;border:1px solid #57544E;background:none;color:var(--band-fg);cursor:pointer;display:grid;place-items:center;font-size:15px}
.hero-ctl .arr:hover{border-color:var(--band-fg)}
@media (max-width:820px){
  .slide{grid-template-columns:1fr;padding:32px 20px 72px;gap:24px}
  .slide .art{order:-1}
  .slide .art img{width:100%}
  .slide .trio{padding-right:0}
  .hero-ctl{left:20px}
}

/* Secciones */
.sec{padding-block:64px 0}
.sec-h{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px 24px;margin-bottom:24px}
.sec-h h2{font-size:clamp(30px,4vw,46px);font-stretch:112%}
.sec-h h2 span{color:var(--muted)}
.sec-h a{font-weight:600;text-underline-offset:4px}

/* Grilla de tienda */
.grid{display:grid;gap:18px}
@media (min-width:640px){.grid{grid-template-columns:repeat(2,1fr)}}
@media (min-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{display:flex;flex-direction:column;border:1px solid var(--line);background:var(--card);border-radius:10px;overflow:hidden;min-width:0}
.card .pic{display:block;position:relative;background:var(--shade);padding:26px 18px;text-decoration:none}
#app .card .pic img{box-shadow:0 8px 20px rgba(23,22,20,.18);transition:transform .4s var(--out)}
.card .pic:hover img{transform:scale(1.03)}
.card .pic{display:grid;place-items:center;aspect-ratio:16/11}
.badge{position:absolute;top:10px;right:10px;background:var(--card);color:var(--fg);border-radius:4px;padding:3px 8px;font:500 11px var(--m);letter-spacing:.06em;text-transform:uppercase}
.card .body{display:flex;flex-direction:column;gap:4px;padding:16px 18px 18px;flex:1}
.card h3{font-size:22px;font-stretch:108%}
.card h3 a{text-decoration:none}
.card h3 a:hover{text-decoration:underline;text-underline-offset:4px}
.card .price{margin-top:auto;padding-top:14px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.card .price b{font:500 20px var(--m)}
.card .price small{font:500 12px var(--m);color:var(--muted)}
.card .btn{margin-top:12px}

/* Bandas */
.band{background:var(--band);color:var(--band-fg);border-radius:14px;padding:48px;display:grid;grid-template-columns:auto 1fr;gap:20px 48px;align-items:center}
.band svg{width:150px;height:150px;color:var(--band-fg)}
.band h2{font-size:clamp(30px,4vw,46px);font-stretch:118%}
.band p{color:var(--band-muted);font-size:18px;max-width:34em;margin-top:12px}
@media (max-width:700px){.band{grid-template-columns:1fr;padding:32px 22px}.band svg{width:96px;height:96px}}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:18px}
@media (min-width:820px){.steps{grid-template-columns:repeat(3,1fr)}}
.steps li{border-top:2px solid var(--fg);padding-top:14px;display:grid;gap:6px}
.steps .n{font:500 13px var(--m);color:var(--muted)}
.steps h3{font-size:21px}

/* Ficha de plugin */
.crumbs{display:flex;gap:8px;padding-block:20px;font-size:14px;color:var(--muted)}
.crumbs a{text-underline-offset:3px}
.ficha{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:40px;align-items:start}
@media (max-width:900px){.ficha{grid-template-columns:1fr;gap:24px}}
@media (min-width:901px){.buy{position:sticky;top:92px}}
.gal-main{background:var(--shade);border-radius:12px;padding:24px;display:grid}
.gal-cap{margin-top:10px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.thumbs{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.thumbs button{width:112px;border:1px solid var(--line);background:var(--shade);border-radius:8px;padding:6px;cursor:pointer}
.thumbs button[aria-pressed="true"]{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.buy{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:28px;display:flex;flex-direction:column;gap:14px}
.buy .plogo{color:var(--fg)}
.buy .plogo svg{height:44px;width:auto;display:block}
.buy .tag{font-size:18px;color:var(--muted);margin-top:-6px}
.buy .ars{font:500 34px/1 var(--m);font-variant-numeric:tabular-nums}
.buy .ars.tbd{font:600 20px var(--d)}
.buy .was{font:500 15px var(--m);color:var(--muted);text-decoration:line-through}
.buy .usd{font:500 13px var(--m);color:var(--muted)}
.buy ul{list-style:none;margin:6px 0 0;padding:14px 0 0;border-top:1px solid var(--line);display:grid;gap:8px;font-size:14px}
.buy li{display:flex;justify-content:space-between;gap:12px}
.buy li span:last-child{text-align:right;font-family:var(--m);font-size:13px}
.note{font-size:14px;color:var(--muted)}
.tabs{margin-top:48px;border-bottom:1px solid var(--line);display:flex;gap:28px;overflow-x:auto}
.tabs button{border:0;background:none;padding:0 0 12px;font-weight:600;font-size:16px;cursor:pointer;white-space:nowrap;color:var(--muted)}
.tabs button[aria-selected="true"]{color:var(--fg);box-shadow:inset 0 -3px 0 var(--fg)}
.panel{padding-block:32px 0}
.feats{display:grid;gap:28px 40px}
@media (min-width:760px){.feats{grid-template-columns:repeat(2,1fr)}}
@media (min-width:1080px){.feats{grid-template-columns:repeat(3,1fr)}}
.feats div{display:grid;gap:6px;align-content:start}
.feats h3{font-size:20px}
.feats p{color:var(--muted);max-width:36ch}
.lead{font-size:clamp(22px,2.6vw,30px);font-weight:600;font-stretch:108%;line-height:1.25;max-width:30em;margin-bottom:32px;text-wrap:balance}
.demos{display:grid;gap:12px;max-width:760px}
.demo{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:16px;border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:var(--card)}
.demo .play{width:42px;height:42px;border-radius:50%;border:0;background:var(--fg);color:var(--bg);display:grid;place-items:center}
.demo .play[disabled]{opacity:.35}
.demo b{display:block}
.specs{display:grid;grid-template-columns:minmax(0,14em) 1fr;max-width:760px;margin:0}
.specs dt,.specs dd{margin:0;padding:12px 0;border-top:1px solid var(--line)}
.specs dt{color:var(--muted)}
.faq{max-width:760px}
.faq details{border-top:1px solid var(--line);padding:16px 0}
.faq summary{font-weight:600;font-size:18px;cursor:pointer}
.faq details p{color:var(--muted);margin-top:8px;max-width:60ch}
.more{display:grid;gap:18px}
@media (min-width:760px){.more{grid-template-columns:repeat(3,1fr)}}

/* Pie */
footer{margin-top:80px;border-top:1px solid var(--line);padding-block:32px calc(32px + env(safe-area-inset-bottom,0px))}
footer .wrap{display:flex;flex-wrap:wrap;gap:16px 32px;align-items:center;justify-content:space-between}
footer .logo svg{height:26px}

/* Carrito */
.scrim{position:fixed;inset:0;background:rgba(18,17,16,.45);opacity:0;pointer-events:none;transition:opacity .25s;z-index:70}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--bg);border-left:1px solid var(--line);z-index:80;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .35s var(--out);visibility:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer.open{transform:none;visibility:visible}
.drawer header{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid var(--line)}
.drawer h2{font-size:26px;font-stretch:112%}
.x{border:1px solid var(--line);background:var(--card);border-radius:50%;width:38px;height:38px;cursor:pointer}
.lines{flex:1;overflow:auto;padding:8px 24px}
.line{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}
.line i{width:12px;height:12px;border-radius:50%}
.line b{display:block}
.line button{border:0;background:none;padding:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:14px}
.line .p{font:500 15px var(--m)}
.empty{padding:24px 0;color:var(--muted)}
.drawer footer{margin:0;padding:20px 24px;display:grid;gap:12px;border-top:1px solid var(--line)}
.tot{display:flex;justify-content:space-between;font-weight:700;font-size:18px}
.tot span:last-child{font-family:var(--m);font-weight:500}
.err{color:var(--sampler5);font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:10px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s var(--out);z-index:90;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

    feats:[['Roll por pad','Mantenés el pad y repite el golpe en la grilla: 1/8, 1/16, 1/32 y tresillos.'],['Browser con categorías','Reconoce kick, snare, hi-hat y más por el nombre del archivo.'],['Choke y 16 salidas','Grupos de corte para los hi-hats y cada pad a su canal del mixer.'],['Cada pad, a mano','Volumen, paneo, pitch de ±24 st, decay, reverse y mono.']],

    demos:['Roll de hi-hat en 1/32','Kit armado desde el browser']},
  eq5: {tag:'Ecualizador de 8 bandas', titular:'Lo ponés en cada canal y te olvidás.', badge:'Beta', version:'1.0.0-beta.1',

    feats:[['8 bandas, 8 filtros','Cortes de 12 y 48 dB/oct, estantes, campana y notch.'],['Estéreo, I/D o M/S','Una curva para los dos canales, una por lado, o una para el medio y otra para los lados.'],['Pantalla grande','Espectro antes y después, retención de picos, notas y lectura exacta de cada punto.'],['Fiel en los agudos','La curva no se aplasta cerca del límite de la frecuencia de muestreo.'],['Latencia cero','Y sobremuestreo 2x o 4x cuando querés agudos todavía más fieles.'],['36 presets','Más A/B, deshacer y rehacer.']],
    formatos:'VST3; AU en macOS', sistemas:'Windows 10 u 11, macOS 10.13 o más nuevo y Linux', daws:DAWS + '. En Logic Pro, como AU.',
    demos:['Voz al frente','Bus de batería']},
  kit5: {tag:'Biblioteca de sonidos', titular:'Tus sonidos. Tu próximo kit.', badge:'Beta', version:'1.0.0-beta.1',
    lead:'Una app de escritorio para ordenar tus MIDI y samples, escucharlos al toque y armar tu próximo kit. No es un plugin: exportás o arrastrás los archivos a tu DAW.',

const PACK = {tag:'Los tres, un solo pago', titular:'Los tres plugins. Un solo pago.', lead:'clip5 y sampler5 hoy, y drum5 cuando salga, sin pagar de nuevo. Cada plugin nuevo que entre al pack también lo recibís.'};
const FAQ = [
  ['¿Por qué «en 5»?','En una perilla de 0 a 10, el 5 es el mediodía: el punto de partida. Los plugins de vst5 están pensados para sonar bien desde ahí. Después los girás a tu gusto.'],
  ['¿Cómo recibo el plugin?','Al aprobarse el pago te llega un email con el link de descarga y tu clave de licencia.'],
  ['¿Por qué cobran en pesos?','Porque queremos que un productor argentino pueda pagar sus herramientas. El precio en pesos sale del precio en dólares con un descuento para Argentina y se actualiza una vez por mes.'],
  ['¿Las actualizaciones se pagan?','No. Las actualizaciones de la misma versión principal (de 1.0 a 1.9, por ejemplo) están incluidas.'],
];
const faqHtml = list => `<div class="faq">${list.map(([q,a],i) => `<details${i?'':' open'}><summary>${q}</summary><p>${a}</p></details>`).join('')}</div>`;
const LOGOS = {clip5:'0 0 246.7 64', sampler5:'0 0 410.6 64', drum5:'0 0 304.7 64'}; // eq5 y kit5 todavía no tienen logo en marca/logo
const plogo = id => `<svg viewBox="${LOGOS[id]}" aria-label="${id}"><use href="#logo-${id}"/></svg>`;

/* ---------- Vistas ---------- */
const btnAdd = (id, cls = 'btn-main') => ALL[id].disponible
  ? `<button class="btn ${cls} add" type="button" data-id="${id}">Agregar al carrito</button>`
  : `<button class="btn ${cls}" type="button" disabled>Disponible pronto</button>`;
const priceTxt = id => ALL[id].usd == null ? 'Precio a confirmar' : pesos(ars(id));

function home(){
  const slide = (id, i) => {
    if (id === 'pack') return `<div class="slide" data-i="${i}" role="group" aria-roledescription="diapositiva" aria-label="Pack vst5">
      <div class="tx"><span class="mono">Pack vst5 · pago único</span><h2>Los tres.</h2><p>clip5, sampler5 y drum5 por ${priceTxt('pack')}.</p>
      <div class="row"><button class="btn btn-light add" type="button" data-id="pack">Agregar al carrito</button><a class="btn btn-ghost" href="#pack">Ver el pack</a></div></div>
      <div class="art trio">${trio()}</div></div>`;
    const f = INFO[id], av = ALL[id].disponible;
    return `<div class="slide" data-i="${i}" role="group" aria-roledescription="diapositiva" aria-label="${id}">
      <div class="tx"><span class="mono">${id} · ${av ? '1.0.0' : f.version || 'próximamente'}</span><h2>${id}</h2><p>${f.titular}</p>

  const card = id => {
    const f = INFO[id] || PACK, isPack = id === 'pack';
    return `<article class="card">
      <a class="pic" href="#${id}" tabindex="-1" aria-hidden="true">${isPack ? `<span class="badge">Ahorrás ${pesos(ars('clip5')+ars('sampler5')+ars('drum5')-ars('pack'))}</span><div class="mini">${trio()}</div>` : `<span class="badge">${f.badge}</span>${shot(id)}`}</a>
      <div class="body"><h3><a href="#${id}">${ALL[id].nombre}</a></h3><span class="muted">${f.tag}</span>
        <div class="price"><b>${priceTxt(id)}</b>${ALL[id].usd ? `<small>USD ${ALL[id].usd}</small>` : ''}</div>${btnAdd(id)}</div></article>`;
  };
  return `<div class="wrap">
    <div class="chips" role="list">
      <a class="chip" role="listitem" href="#clip5" style="--c:var(--clip5)"><i>GRATIS</i><span><b>clip5 lite</b><span class="muted">Probalo sin pagar</span></span></a>
      <a class="chip" role="listitem" href="#pack"><i class="inv">PACK</i><span><b>Los tres plugins</b><span class="muted">USD ${P.pack.usd}, un solo pago</span></span></a>
      <a class="chip" role="listitem" href="#sampler5" style="--c:var(--sampler5)"><i>NUEVO</i><span><b>sampler5 1.0.0</b><span class="muted">Un loop, 16 pads</span></span></a>
      <a class="chip" role="listitem" href="#eq5"><i class="inv">BETA</i><span><b>eq5</b><span class="muted">Ecualizador de 8 bandas</span></span></a>
      <a class="chip" role="listitem" href="#drum5" style="--c:var(--drum5)"><i>PRONTO</i><span><b>drum5</b><span class="muted">Batería de 16 pads</span></span></a>
    </div>
    <section class="hero" aria-roledescription="carrusel" aria-label="Destacados">
      <div class="slides" id="slides" aria-live="off">${order.map(slide).join('')}</div>
      <div class="hero-ctl">
        <button class="arr" type="button" id="prev" aria-label="Anterior">‹</button>
        ${order.map((id,i) => `<button class="dot" type="button" data-go="${i}" aria-label="Ver ${ALL[id].nombre}"></button>`).join('')}
        <button class="arr" type="button" id="next" aria-label="Siguiente">›</button>
        <button class="arr" type="button" id="pause" aria-label="Pausar">❚❚</button>
      </div>
    </section>
    <section class="sec" aria-labelledby="h-plugins">
      <div class="sec-h"><h2 id="h-plugins">Productos <span>· máquinas clásicas, workflow de hoy</span></h2></div>
      <div class="grid">${['clip5','sampler5','pack','eq5','drum5','kit5'].map(card).join('')}</div>
    </section>
    <section class="sec">
      <div class="band"><svg viewBox="0 0 64 64" aria-hidden="true"><use href="#logo-k"/></svg>
        <div><h2>Todo arranca en 5.</h2><p>En una perilla de 0 a 10, el 5 es el mediodía. Cada plugin de vst5 sale de fábrica sonando bien ahí. Después lo girás hasta que sea tuyo.</p></div></div>
    </section>
    <section class="sec" aria-labelledby="h-compra">
      <div class="sec-h"><h2 id="h-compra">Cómo comprás</h2><p class="muted">El pago pasa por Mercado Pago. Nunca vemos los datos de tu tarjeta.</p></div>
      <ol class="steps">
        <li><span class="n">Paso 1</span><h3>Armás el carrito</h3><p class="muted">Un plugin o el pack. Si el pack está en el carrito, no te cobramos los sueltos.</p></li>
        <li><span class="n">Paso 2</span><h3>Pagás con Mercado Pago</h3><p class="muted">Tarjeta de crédito, débito o dinero en cuenta.</p></li>
        <li><span class="n">Paso 3</span><h3>Te llega por email</h3><p class="muted">El link de descarga y tu clave de licencia.</p></li>
      </ol>
    </section>
  </div>`;
}

function ficha(id){
  const isPack = id === 'pack', f = isPack ? PACK : INFO[id], av = ALL[id].disponible;
  const suma = ars('clip5') + ars('sampler5') + ars('drum5');
  const gal = isPack
    ? `<div class="gal-main mini">${trio()}</div>
       <div class="gal-cap"><span>clip5, sampler5 y drum5</span><span>Capturas reales</span></div>`
    : `<div class="gal-main" id="galMain">${shot(id, 0, false)}</div>
       <div class="gal-cap"><span id="galCap">${SHOTS[id][0][1]}</span><span>Captura real</span></div>
       <div class="thumbs" role="group" aria-label="Capturas">${SHOTS[id].map(([, cap], i) => `<button type="button" data-shot="${i}" aria-pressed="${!i}" aria-label="${cap}">${shot(id, i)}</button>`).join('')}</div>`;
  const tabs = isPack
    ? [['incluye','Qué incluye', `<div class="more">${['clip5','sampler5','drum5'].map(p => `<article class="card"><a class="pic" href="#${p}" tabindex="-1" aria-hidden="true">${shot(p)}</a><div class="body"><h3><a href="#${p}">${p}</a></h3><span class="muted">${INFO[p].tag}</span><div class="price"><b>${priceTxt(p)}</b><small>suelto</small></div></div></article>`).join('')}</div>`],
       ['preguntas','Preguntas', faqHtml(FAQ)]]
    : [['que','Qué hace', `<p class="lead">${f.lead}</p><div class="feats">${f.feats.map(([h,p]) => `<div><h3>${h}</h3><p>${p}</p></div>`).join('')}</div>`],
       ...(f.demos.length ? [['demos','Demos', `<div class="demos">${f.demos.map(d => `<div class="demo"><button class="play" type="button" disabled aria-label="Escuchar ${d}">▶</button><div><b>${d}</b><span class="muted">Antes y después</span></div><span class="mono muted">Pendiente</span></div>`).join('')}</div><p class="note" style="margin-top:14px">Las demos de audio todavía no están grabadas.</p>`]] : []),
       ['requisitos','Requisitos', `<dl class="specs"><dt>Formatos</dt><dd>${f.formatos}</dd><dt>Sistemas</dt><dd>${f.sistemas}</dd><dt>DAW</dt><dd>${f.daws}</dd><dt>Licencia</dt><dd>${ALL[id].usd ? 'Pago único. Actualizaciones de la versión 1 incluidas.' : 'Precio y licencia a confirmar.'}</dd><dt>Idioma</dt><dd>Español</dd></dl>`],
       ['preguntas','Preguntas', faqHtml(FAQ)]];
  return `<div class="wrap">
    <nav class="crumbs" aria-label="Ubicación"><a href="#">Inicio</a><span>›</span><span>${ALL[id].nombre}</span></nav>
    <div class="ficha">
      <div>${gal}</div>
      <aside class="buy" aria-label="Comprar ${ALL[id].nombre}">
        <div class="plogo">${isPack ? `<h1 style="font-size:40px;font-stretch:118%">Pack vst5</h1>` : `${LOGOS[id] ? `<h1 class="sr">${id}</h1>${plogo(id)}` : `<h1 style="font-size:44px;font-stretch:118%">${id}</h1>`}`}</div>
        <p class="tag">${f.tag}</p>
        <p style="font-size:17px">${f.titular}</p>
        <div>${isPack ? `<div class="was">${pesos(suma)}</div>` : ''}<div class="ars${ALL[id].usd ? '' : ' tbd'}">${priceTxt(id)}</div>${ALL[id].usd ? `<div class="usd">USD ${ALL[id].usd} · pago único</div>` : ''}</div>
        ${av ? btnAdd(id) : `<button class="btn btn-main" type="button" disabled>Disponible pronto</button><p class="note">${id === 'drum5' ? 'Si comprás el pack hoy, drum5 te llega cuando salga.' : `Está en beta (${f.version}).`}</p>`}
        ${f.lite ? `<button class="btn btn-line" type="button" data-soon="La descarga de clip5 lite todavía no está activa.">Descargar clip5 lite gratis</button>` : ''}
        ${isPack ? '' : `<ul><li><span class="muted">Formatos</span><span>${f.formatos}</span></li><li><span class="muted">Sistemas</span><span>${f.sistemas}</span></li><li><span class="muted">Versión</span><span>${av ? '1.0.0' : f.version || '—'}</span></li></ul>`}
      </aside>
    </div>
    <div class="tabs" role="tablist" aria-label="Detalle">${tabs.map(([k,t],i) => `<button type="button" role="tab" id="tab-${k}" aria-controls="pn-${k}" aria-selected="${!i}" tabindex="${i?-1:0}">${t}</button>`).join('')}</div>
    ${tabs.map(([k,,html],i) => `<section class="panel" role="tabpanel" id="pn-${k}" aria-labelledby="tab-${k}"${i?' hidden':''}>${html}</section>`).join('')}
  </div>`;
}

function soporte(){
  return `<div class="wrap"><nav class="crumbs" aria-label="Ubicación"><a href="#">Inicio</a><span>›</span><span>Soporte</span></nav>
    <div class="sec-h"><h1 style="font-size:clamp(34px,5vw,56px);font-stretch:112%">Soporte</h1></div>${faqHtml(FAQ)}</div>`;
}

/* ---------- Ruteo por hash (#clip5, #sampler5, #drum5, #eq5, #kit5, #pack, #soporte) ---------- */
let timer = null;
function route(){
  clearInterval(timer);
  const h = location.hash.slice(1), app = $('#app');
  app.innerHTML = ALL[h] ? ficha(h) : h === 'soporte' ? soporte() : home();
  $$('.nav ul a').forEach(a => a.toggleAttribute('aria-current', a.getAttribute('href') === '#' + h));
  if (ALL[h]) document.title = `${ALL[h].nombre} · vst5`; else document.title = 'vst5';
  scrollTo(0, 0);
  if ($('#slides')) carrusel();
  if ($('[role=tablist]')) pestanias();
  $$('[data-shot]').forEach(b => b.addEventListener('click', () => {
    const i = +b.dataset.shot;
    $('#galMain').innerHTML = shot(h, i, false);
    $('#galCap').textContent = SHOTS[h][i][1];
    $$('[data-shot]').forEach(x => x.setAttribute('aria-pressed', x === b));
  }));
  render();
}

function carrusel(){
  const slides = $$('.slide'), dots = $$('.dot'), quiet = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let i = 0, playing = !quiet;
  const go = n => { i = (n + slides.length) % slides.length;
    slides.forEach((s, k) => { s.classList.toggle('on', k === i); s.toggleAttribute('inert', k !== i); });
    dots.forEach((d, k) => d.setAttribute('aria-current', k === i)); };
  const play = on => { playing = on; clearInterval(timer); if (on) timer = setInterval(() => go(i + 1), 6000);
    $('#pause').textContent = on ? '❚❚' : '▶'; $('#pause').setAttribute('aria-label', on ? 'Pausar' : 'Reproducir'); };
  $('#prev').onclick = () => { go(i - 1); play(false); };
  $('#next').onclick = () => { go(i + 1); play(false); };
  $('#pause').onclick = () => play(!playing);
  dots.forEach(d => d.onclick = () => { go(+d.dataset.go); play(false); });
  const hero = $('.hero');
  hero.addEventListener('pointerenter', () => playing && clearInterval(timer));
  hero.addEventListener('pointerleave', () => playing && play(true));
  hero.addEventListener('focusin', () => clearInterval(timer));
  go(0); play(playing);
}

function pestanias(){
  const tabs = $$('[role=tab]');
  const sel = t => { tabs.forEach(x => { const on = x === t; x.setAttribute('aria-selected', on); x.tabIndex = on ? 0 : -1; $('#' + x.getAttribute('aria-controls')).hidden = !on; }); t.focus(); };
  tabs.forEach((t, k) => { t.onclick = () => sel(t);
    t.onkeydown = e => { const d = {ArrowRight:1, ArrowLeft:-1}[e.key]; if (d){ e.preventDefault(); sel(tabs[(k + d + tabs.length) % tabs.length]); } }; });
}

/* ---------- Carrito ---------- */
let cart = [];
try { cart = JSON.parse(localStorage.getItem('vst5-carrito') || '[]'); } catch (e) {}
const drawer = $('#drawer'), scrim = $('#scrim');
const open = on => { drawer.classList.toggle('open', on); scrim.classList.toggle('open', on); drawer.setAttribute('aria-hidden', !on); if (on) $('#cartClose').focus(); };
function render(){
  const items = Precios.armarCarrito(cart, CFG); cart = items.map(i => i.id);
  try { localStorage.setItem('vst5-carrito', JSON.stringify(cart)); } catch (e) {}
  $('#cartCount').textContent = items.length;
  $('#lines').innerHTML = items.length ? items.map(i => `<div class="line"><i style="background:${COLOR[i.id] || 'var(--fg)'}"></i><div><b>${i.nombre}</b><button type="button" data-rm="${i.id}">Quitar</button></div><span class="p">${pesos(i.ars)}</span></div>`).join('')
    : '<p class="empty">Todavía no agregaste nada.</p>';
  $('#total').textContent = pesos(items.reduce((a, i) => a + i.ars, 0));
  $('#checkout').disabled = !items.length;
  $$('.add').forEach(b => { const id = b.dataset.id, inPack = cart.includes('pack') && id !== 'pack' && P.pack.incluye.includes(id);
    if (!b.dataset.txt) b.dataset.txt = b.textContent;
    const inCart = cart.includes(id) || inPack;
    b.classList.toggle('in', inCart); b.textContent = inCart ? (inPack ? 'Incluido en el pack' : 'En el carrito ✓') : b.dataset.txt; });
}
document.addEventListener('click', e => {
  const add = e.target.closest('.add'); if (add){ const id = add.dataset.id; if (!cart.includes(id)) cart.push(id); render(); open(true); return; }
  const rm = e.target.closest('[data-rm]'); if (rm){ cart = cart.filter(x => x !== rm.dataset.rm); render(); return; }
  const soon = e.target.closest('[data-soon]'); if (soon) toast(soon.dataset.soon);
});
let tt; const toast = msg => { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 3200); };
$('#cartOpen').onclick = () => open(true);
$('#cartClose').onclick = () => open(false);
scrim.onclick = () => open(false);
addEventListener('keydown', e => { if (e.key === 'Escape') open(false); });
$('#checkout').addEventListener('click', async () => {
  const btn = $('#checkout'), msg = $('#coMsg'); btn.disabled = true; btn.textContent = 'Conectando con Mercado Pago…'; msg.hidden = true;
  try {
    const r = await fetch('/api/crear-preferencia', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ids:cart})});
    const d = await r.json().catch(() => ({}));
    if (r.ok && d.url){ location.href = d.url; return; }
    throw new Error(d.error || 'El pago todavía no está activo en esta versión de la página.');
  } catch (e) {
    msg.textContent = /fetch|JSON/i.test(e.message) ? 'El pago todavía no está activo en esta versión de la página.' : e.message; msg.hidden = false;
  }
  btn.disabled = false; btn.textContent = 'Pagar con Mercado Pago';
});

/* ---------- Vuelta de Mercado Pago ---------- */
const pago = new URLSearchParams(location.search).get('pago');
const TXT = {aprobado:'Pago aprobado. En unos minutos te llega el email con el instalador y tu clave.', pendiente:'Tu pago quedó pendiente. Cuando Mercado Pago lo apruebe, te llega el email.', rechazado:'El pago no se pudo hacer. Probá con otro medio de pago.'};
if (TXT[pago]){ if (pago === 'aprobado') cart = []; setTimeout(() => toast(TXT[pago]), 300); }

addEventListener('hashchange', route);
route();
})();
</script>
